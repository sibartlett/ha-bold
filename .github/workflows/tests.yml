name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    name: tests (Home Assistant ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pinned
            requirements: -r requirements_test.txt
          # The minimum version in hacs.json: Home Assistant 2026.8.0.
          - name: minimum
            requirements: pytest-homeassistant-custom-component==0.13.354
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ${{ matrix.requirements }}
      - run: pytest --cov=custom_components.bold --cov-report=term-missing --cov-fail-under=95
