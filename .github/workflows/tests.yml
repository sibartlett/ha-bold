name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=custom_components.bold --cov-report=term-missing --cov-fail-under=95
