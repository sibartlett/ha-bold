name: Feature request
description: Something the integration could do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you want to do with your locks, and why.
    validations:
      required: true
  - type: textarea
    id: bold
    attributes:
      label: What Bold offers
      description: >-
        If it's something the Bold app does, how it looks there. Some features
        need Bold Pro, or aren't available through Bold's API.
