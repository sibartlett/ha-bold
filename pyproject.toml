[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# As Home Assistant core: no private access or local imports without a
# reason, and no stale noqa comments. And keep functions simple.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL", "PLC0415", "SLF001", "RUF100", "C901"]
ignore = ["E501", "PLR0911", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0917"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["custom_components/bold"]
