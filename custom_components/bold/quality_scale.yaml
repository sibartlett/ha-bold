rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no actions.
  appropriate-polling:
    status: done
    comment: |
      Bold pushes events to a webhook when Home Assistant is reachable from
      the internet; the event log is then polled every 5 minutes as a safety
      net. Without pushes it's polled every 30 seconds. Devices are polled
      every 10 minutes.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: The API client is part of the integration; it has no requirements.
  docs-actions:
    status: exempt
    comment: The integration has no actions.
  docs-conditions:
    status: exempt
    comment: The integration has no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration has no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: The data update coordinators log when fetching fails and recovers.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: |
      Bold devices are discovered over Bluetooth, and the Bold Connect by its
      DHCP hostname. Discovery only offers to set up Bold, once.
  discovery-update-info:
    status: exempt
    comment: Bold is a cloud service; there is no network address to update.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: |
      The only configuration is the Bold account, whose credentials are
      renewed with the reauthentication flow.
  repair-issues:
    status: done
    comment: |
      A Bold Connect offline for an hour, a lock only reachable over Bluetooth
      that's out of range for an hour, and a lock with no way to reach it.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
